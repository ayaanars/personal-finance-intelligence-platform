[project]
name = "ledgerx-api"
version = "0.1.0"
description = "LedgerX API foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.19.2",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires an explicit PostgreSQL test database URL"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.6",
]
